[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-billing"
version = "0.10.0"
description = "Billing and payments Django app for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "billing", "payments", "stripe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floor: 0.26.0 emits docs/errors.json with the `owner` field the
    # committed artifact and its drift gate require.
    "stapel-core>=0.26.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-billing"
Repository = "https://github.com/usestapel/stapel-billing"
Documentation = "https://github.com/usestapel/stapel-billing#readme"
Changelog = "https://github.com/usestapel/stapel-billing/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-billing/issues"

[project.optional-dependencies]
stripe = ["stripe>=8.0,<12"]
# tasks.py imports celery lazily and works without it (the three workers are
# plain callables a cron can drive), but get_billing_beat_schedule() builds
# celery crontab entries — the extra is for hosts that want that factory.
celery = ["celery>=5.3"]
all = ["stapel-billing[stripe,celery]"]

[tool.setuptools]
package-dir = {"stapel_billing" = "."}
packages = ["stapel_billing", "stapel_billing.migrations", "stapel_billing.providers"]

[tool.setuptools.package-data]
stapel_billing = ["py.typed", "migrations/*.py", "schemas/**/*.json", "translations/*.json", "migrations/**/*.py", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
# Measure the shipped library code only: the packaged test suite, its
# conftest and the migration files are distributed for reuse but are not
# runtime code exercised by the host project.
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
